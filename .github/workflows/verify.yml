name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript, insights and the main-process boundary
        run: |
          for file in 'Activity Desk.app/Contents/Resources/app/'*.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs
      - name: Lint workflows and shell scripts
        run: |
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/$archive" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          shellcheck scripts/*.sh
      - name: Reject tracked dotenv files and scan for secrets
        run: |
          if [ -n "$(git ls-files -- '*.env' '*.env.*' '.envrc' '**/.envrc' '.direnv/**' '**/.direnv/**')" ]; then
            echo "::error::Remove tracked dotenv or direnv files."
            exit 1
          fi
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/$archive" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner
